<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071c32">
  <link rel="icon" href="./assets/brand/sealien-mark.png">
  <title>七章配音影片 · 深海智人 FlowScope 3D</title>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; background:#071c32; color:#e9f6ff; font:15px/1.5 "Segoe UI","Microsoft YaHei",sans-serif; }
    header { display:flex; align-items:center; gap:18px; max-width:1460px; margin:auto; padding:13px clamp(12px,3vw,40px) 0; }
    header h1 { margin:0; font-size:18px; font-weight:650; }
    header h1 span { margin-left:10px; border-left:1px solid #487088; padding-left:10px; color:#a0c3da; font-size:14px; font-weight:450; }
    a { color:#b9eaff; text-underline-offset:4px; }
    header a { margin-left:auto; font-size:13px; }
    main { max-width:1460px; margin:auto; padding:16px clamp(12px,3vw,40px) 24px; }
    video { display:block; width:100%; aspect-ratio:16/9; max-height:calc(100svh - 175px); background:#071c32; }
    video::cue { font:500 clamp(15px,1.65vw,30px)/1.35 "Microsoft YaHei",sans-serif; color:white; background-color:rgba(5,20,34,.9); }
    nav { display:flex; align-items:stretch; overflow:auto; border-block:1px solid #35526a; }
    nav button { flex:1; white-space:nowrap; border:0; border-bottom:3px solid transparent; padding:10px 12px;
      color:#c4d9e8; background:#0c233b; font:inherit; font-size:14px; text-align:left; cursor:pointer; }
    nav button span { display:block; font:12px Consolas,monospace; color:#84acc5; }
    nav button[aria-current="step"] { background:#104366; border-bottom-color:#0098dc; color:white; }
    nav button:hover { background:#153c59; }
    .links { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px 20px; margin-top:12px; font-size:13px; }
    .links div { display:flex; flex-wrap:wrap; gap:15px; }
    :focus-visible { outline:2px solid #39bdff; outline-offset:-2px; }
    @media(max-width:620px) { header { gap:8px; } header h1 { font-size:15px; } header h1 span,header a { font-size:12px; } nav button { padding:8px; font-size:12px; } video { max-height:none; } }
  </style>
</head>
<body>
  <header><h1>流场世界模型<span id="edition">30 秒 · 4K 展示短片</span></h1><a id="explore" href="./index.html#wake">进入互动展示 ↗</a></header>
  <main>
    <video id="film" controls playsinline preload="metadata" poster="./assets/film-poster.jpg" aria-label="流场世界模型七章中文配音影片">
      <track id="captions" kind="captions" srclang="zh-CN" label="简体中文" default>
    </video>
    <nav aria-label="影片章节"></nav>
    <div class="links"><span id="status" role="status">正在载入影片…</span><div>
      <a id="download-film" hidden>下载影片</a>
      <a id="other-edition" href="./film.html?edition=full">原版完整讲解 · 5 分 33 秒</a>
      <a id="subtitle-file" href="./media/flowscope-30s-4k.vtt" download>下载字幕</a>
      <a id="audio-file" href="./assets/guide.m4a?v=r16" download="FlowScope-完整讲解旁白.m4a" hidden>下载完整讲解旁白</a>
      <a id="narration-file" href="./library/narration.md?v=r16" target="_blank" hidden>逐镜旁白稿</a>
    </div></div>
  </main>
  <script type="module">
    import {loadFilm} from './src/film-media.ts';
    const film=document.querySelector('#film'), nav=document.querySelector('nav'), status=document.querySelector('#status');
    const ids=['wake','encoder','latent','decoder','temporal','fm','rollout'];
    const names=['涡脱落','空间编码','潜空间','物理解码','双轨时空','FM 推演','滚动对照'];
    const download=document.querySelector('#download-film');
    const params=new URLSearchParams(location.search);
    const full=params.get('edition')==='full'||['r16','r17'].includes(params.get('v'));
    const manifest=full?'./library/flowscope-demo.parts.json':'./media/flowscope-30s-4k.parts.json';
    const captions=full?'./library/flowscope-demo.vtt':'./media/flowscope-30s-4k.vtt';
    const alternate=document.querySelector('#other-edition');
    alternate.textContent=full?'30 秒 · 4K 展示短片':'原版完整讲解 · 5 分 33 秒';
    document.querySelector('#edition').textContent=full?'原版完整讲解 · 1080p':'30 秒 · 4K 展示短片';
    document.querySelector('#captions').src=captions;
    document.querySelector('#subtitle-file').href=captions;
    document.querySelector('#audio-file').hidden=!full;
    document.querySelector('#narration-file').hidden=!full;
    download.download=full?'FlowScope-完整讲解.mp4':'FlowScope-30s-4K.mp4';
    const time=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')+(!full && s%1===.5?'.5':'');
    let starts=[], last=-1, pending=0, movieURL='';
    function show(index) {
      if (last===index) return;
      last=index;
      [...nav.children].forEach((button,i)=>i===index?button.setAttribute('aria-current','step'):button.removeAttribute('aria-current'));
      document.querySelector('#explore').href='./index.html#'+ids[index];
      alternate.href='./film.html'+(full?'':'?edition=full')+'#'+ids[index];
      status.textContent='第 '+(index+1)+' 章　'+names[index];
    }
    function seek(index) {
      pending=Math.max(0,index);
      if(starts.length && film.readyState>=1)film.currentTime=starts[pending];
      show(pending);
    }
    function fromHash() { return Math.max(0,ids.indexOf(location.hash.slice(1))); }
    async function open() {
      if(full) {
        const response=await fetch('./assets/guide.json?v=r16');
        if(!response.ok)throw Error();
        starts=(await response.json()).starts;
      } else {
        starts=[0,8,10.5,13,15.5,18,26];
      }
      if(starts.length!==ids.length)throw Error();
      names.forEach((name,i)=>{
        const button=document.createElement('button');
        button.type='button';button.textContent=name;
        const mark=document.createElement('span');mark.textContent=time(starts[i]);button.prepend(mark);
        button.onclick=()=>{history.replaceState(null,'','#'+ids[i]);seek(i);film.play().catch(()=>{});};
        nav.append(button);
      });
      seek(fromHash());
      window.addEventListener('hashchange',()=>seek(fromHash()));
      film.addEventListener('loadedmetadata',()=>{
        const webCaptions=document.querySelector('#captions').track;
        for(const track of film.textTracks) {
          if(track!==webCaptions && (track.kind==='captions'||track.kind==='subtitles'))track.mode='disabled';
        }
        seek(pending);
        if(params.has('play'))film.play().catch(()=>{status.textContent='点击播放即可听到中文旁白';});
      },{once:true});
      film.addEventListener('play',()=>{last=-1;});
      film.addEventListener('timeupdate',()=>show(Math.max(0,starts.filter(s=>s<=film.currentTime+.002).length-1)));
      film.addEventListener('error',()=>{status.textContent='影片读取失败，可点击「下载影片」使用本地播放器观看。';});
      movieURL=URL.createObjectURL(await loadFilm(manifest));
      download.href=movieURL;
      download.hidden=false;
      film.src=movieURL;
      if(params.has('download'))download.click();
    }
    open().catch(()=>{status.textContent='影片载入失败，请刷新后重试。';});
    window.addEventListener('pagehide',e=>{if(!e.persisted&&movieURL)URL.revokeObjectURL(movieURL);});
  </script>
</body>
</html>
